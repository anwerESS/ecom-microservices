management:
  endpoints:
    web:
      exposure:
        include: beans, health
  endpoint:
    health:
      show-details: always
    shutdown:
      enabled: true
  info:
    env:
      enabled: true

server:
  shutdown: graceful

info:
  app:
    name: MyNewApp
    description: App built by us
    version: 1.0.0










  

  #############################################
  ################# ACTUATORS #################
  #############################################
  # Some of the most commonly used endpoints are:
  # /actuator/health: Displays application health information (e.g., status, details)
  # /actuator/info: Displays application information (e.g., name, version, build)
  # /actuator/metrics: Displays application metrics (e.g., CPU usage, memory usage)
  # /actuator/mappings: Displays the configured HTTP request mappings
  # /actuator/beans: Displays the Spring beans in the application context
  # /actuator/env: Displays the application environment properties
  # /actuator/trace: Displays traces of recent requests
  # /actuator/dump: Dumps the heap of the running application
  # /actuator/configprops: Displays the application configuration properties
  # /actuator/logfile: Tails the log file of the running application
  # /actuator/httptrace: Displays HTTP request and response details
  # /actuator/refresh: Refreshes the application context

