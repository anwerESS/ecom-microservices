spring:
  application:
    name: configdemo
  config:
    import: optional:configserver:http://localhost:8888
  profiles:
    active: prod

build:
  id: ${ID:123}
  version: ${VERSION:v1.2.3}
  name: ${NAME:default_version}

# expose the refresh endpoint
# it allows to refresh the configuration by calling it
# curl -X POST http://localhost:8888/actuator/refresh
management:
  endpoints:
    web:
      exposure:
        include: refresh

